<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilişim Şube - İmaj Netleştirme v4.0</title>
    <style>
        body {
            background-color: #030303;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }
        .container {
            width: 950px;
            background: #0a0a0a;
            border: 1px solid #333;
            box-shadow: 0 0 35px rgba(139, 0, 0, 0.3);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        .header {
            border-bottom: 2px dashed #444;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        h1 {
            color: #b30000;
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            font-size: 26px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(179, 0, 0, 0.5);
        }
        p {
            color: #888;
            font-size: 13px;
            margin: 0;
            letter-spacing: 1px;
        }
        .main-panel {
            display: flex;
            gap: 30px;
            height: 450px;
        }
        .image-viewer {
            flex: 1;
            background: repeating-linear-gradient(45deg, #0d0000, #0d0000 5px, #080000 5px, #080000 10px);
            border: 2px solid #330000;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 60px rgba(0,0,0,0.9);
        }
        /* Dinamik Filtre Katmanı */
        #evidence-layer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.1s;
        }
        .blood-stain {
            width: 250px;
            height: 400px;
        }
        .controls {
            width: 380px;
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            justify-content: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .control-group label {
            font-size: 13px;
            color: #999;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .val-display {
            color: #ff3333;
            font-family: monospace;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #1a0000;
            height: 8px;
            border-radius: 4px;
            outline: none;
            border: 1px solid #440000;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 24px;
            background: #8b0000;
            border: 1px solid #ff4444;
            cursor: pointer;
            border-radius: 2px;
        }
        input[type=range]::-webkit-slider-thumb:active {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        button {
            margin-top: 20px;
            background: #2a0000;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 18px;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ff2222;
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 34, 34, 0.6);
        }
        button:disabled {
            background: #222;
            color: #555;
            border-color: #444;
            cursor: not-allowed;
            box-shadow: none;
        }
        #terminal {
            margin-top: 25px;
            background: #000;
            border: 1px solid #330000;
            padding: 20px;
            font-size: 16px;
            min-height: 25px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .error { color: #ff3333; text-shadow: 0 0 10px #ff0000; }
        .success { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        
        /* Gizli 42 Rakamı Başlangıçta Tamamen Görünmez */
        #hidden-number {
            font-family: 'Impact', sans-serif;
            font-size: 110px;
            fill: #ff0000; 
            opacity: 0; 
            transition: opacity 1s, text-shadow 1s;
        }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: #ff0000;
            box-shadow: 0 0 20px #ff0000;
            top: 0;
            left: 0;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Kriminal İmaj Restorasyonu</h1>
            <p>Kan gölü içindeki izin doku şifresini çözmek için Işık, Kontrast ve Keskinlik filtrelerini sekronize edin.</p>
        </div>

        <div class="main-panel">
            <div class="image-viewer">
                <div class="scan-line" id="scanner"></div>
                
                <div id="evidence-layer">
                    <svg class="blood-stain" viewBox="0 0 200 300">
                        <path d="M 40,20 C 10,40 5,100 20,140 L 45,210 C 45,280 115,290 115,210 L 140,140 C 160,100 150,40 120,20 C 105,10 85,20 85,20 C 85,20 70,10 40,20 Z" fill="#3a0000" />
                        
                        <path d="M 50,60 L 110,60" fill="none" stroke="#660000" stroke-width="8" stroke-dasharray="10,5"/>
                        <path d="M 55,90 L 115,90" fill="none" stroke="#660000" stroke-width="8" stroke-dasharray="10,5"/>
                        <path d="M 60,120 L 120,120" fill="none" stroke="#660000" stroke-width="8" stroke-dasharray="10,5"/>
                        <path d="M 65,150 L 125,150" fill="none" stroke="#660000" stroke-width="8" stroke-dasharray="10,5"/>
                        <path d="M 70,180 L 120,180" fill="none" stroke="#660000" stroke-width="8"/>
                        
                        <text x="95" y="180" id="hidden-number" text-anchor="middle">42</text>
                    </svg>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>Foton Işıması (Parlaklık) <span class="val-display" id="val-light">0</span></label>
                    <input type="range" id="slide-light" min="20" max="250" value="30">
                </div>

                <div class="control-group">
                    <label>Doku Kontrastı <span class="val-display" id="val-contrast">0</span></label>
                    <input type="range" id="slide-contrast" min="50" max="250" value="70">
                </div>

                <div class="control-group">
                    <label>Mikro Keskinlik (Odak) <span class="val-display" id="val-blur">0</span></label>
                    <input type="range" id="slide-blur" min="0" max="15" value="12">
                </div>

                <button id="btn-analyze" onclick="startScan()">ANALİZİ BAŞLAT</button>
            </div>
        </div>

        <div id="terminal" style="color: #666;">FİLTRE DEĞERLERİ BEKLENİYOR...</div>
    </div>

    <script>
        const layer = document.getElementById('evidence-layer');
        const sLight = document.getElementById('slide-light');
        const sContrast = document.getElementById('slide-contrast');
        const sBlur = document.getElementById('slide-blur');
        
        const vLight = document.getElementById('val-light');
        const vContrast = document.getElementById('val-contrast');
        const vBlur = document.getElementById('val-blur');
        
        const terminal = document.getElementById('terminal');
        const scanner = document.getElementById('scanner');
        const btn = document.getElementById('btn-analyze');
        const hiddenNumber = document.getElementById('hidden-number');

        // KAZANMA KOŞULLARI (Oyuncu ayakkabı tırtıklarını görsel olarak en net hale getirdiğinde bu değerlere ulaşmış olacak)
        const targetLightMin = 130, targetLightMax = 180;
        const targetContrastMin = 130, targetContrastMax = 190;
        const targetBlurMax = 2; // Neredeyse sıfır bulanıklık

        function updateFilters() {
            let b = sLight.value;
            let c = sContrast.value;
            let bl = sBlur.value;

            // Ekrandaki şifreli yazılar (16'lık taban - hexadecimal görünüm)
            vLight.innerText = "0x" + parseInt(b).toString(16).toUpperCase();
            vContrast.innerText = "0x" + parseInt(c).toString(16).toUpperCase();
            vBlur.innerText = "0x" + (15 - bl).toString(16).toUpperCase();

            // Rengi bozmadan sadece ışık, zıtlık ve bulanıklık ayarı
            layer.style.filter = `brightness(${b}%) contrast(${c}%) blur(${bl}px)`;
        }

        sLight.addEventListener('input', updateFilters);
        sContrast.addEventListener('input', updateFilters);
        sBlur.addEventListener('input', updateFilters);

        function startScan() {
            btn.disabled = true;
            terminal.innerHTML = "KRİPTOLOJİK TARAMA YAPILIYOR...";
            terminal.style.color = "#ffaa00";
            
            scanner.style.display = "block";
            let pos = -10;
            
            let scanAnim = setInterval(() => {
                pos += 15;
                scanner.style.top = pos + "px";
                
                if(pos > 450) {
                    clearInterval(scanAnim);
                    scanner.style.display = "none";
                    scanner.style.top = "-10px";
                    evaluateImage();
                }
            }, 30);
        }

        function evaluateImage() {
            let b = parseInt(sLight.value);
            let c = parseInt(sContrast.value);
            let bl = parseInt(sBlur.value);

            let isLightOk = (b >= targetLightMin && b <= targetLightMax);
            let isContrastOk = (c >= targetContrastMin && c <= targetContrastMax);
            let isBlurOk = (bl <= targetBlurMax);

            if (isLightOk && isContrastOk && isBlurOk) {
                // Şifre Çözüldü - Kan kırmızı parlayan dev 42!
                hiddenNumber.style.opacity = "1";
                hiddenNumber.style.textShadow = "0 0 20px #ff0000, 0 0 40px #ff0000";
                
                terminal.innerHTML = "DOKU ÇÖZÜNÜRLÜĞÜ %100.<br> KESİN EŞLEŞME: 42 NUMARA AYAK İZİ TESPİT EDİLDİ.";
                terminal.className = "success";
                
                sLight.disabled = true;
                sContrast.disabled = true;
                sBlur.disabled = true;
            } else {
                // Şifre Yanlış
                terminal.innerHTML = "SİNYAL KİRLİ. AYAKKABI TABAN DETAYLARI NET DEĞİL. DAHA HASSAS AYAR YAPINIZ.";
                terminal.className = "error";
                btn.disabled = false;
            }
        }

        // Başlangıç durumu
        updateFilters();
    </script>
</body>
</html>
