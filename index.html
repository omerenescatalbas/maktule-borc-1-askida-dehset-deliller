<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kriminal Laboratuvar - Aktif Eşleştirme</title>
    <style>
        body { 
            background: #0a0a0a; 
            color: #eee; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            margin: 0; 
            padding: 20px; 
            user-select: none; 
        }
        .container { 
            max-width: 850px; 
            margin: 0 auto; 
            background: #111; 
            border: 1px solid #333; 
            padding: 25px; 
            box-shadow: 0 0 30px rgba(139,0,0,0.2); 
        }
        h1 { 
            color: #8b0000; 
            letter-spacing: 2px; 
            text-transform: uppercase; 
            border-bottom: 1px dashed #444; 
            padding-bottom: 10px; 
        }
        p { 
            color: #999; 
            margin-bottom: 25px; 
        }
        .game-area { 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            gap: 20px; 
            margin-top: 30px; 
            padding: 20px;
            background: repeating-linear-gradient(0deg, #151515, #151515 2px, #111 2px, #111 20px);
            border: 1px solid #222;
        }
        .suspect-panel { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            width: 35%; 
        }
        .draggable-shoe { 
            background: #1a1a1a; 
            border: 1px solid #444; 
            padding: 15px; 
            cursor: grab; 
            transition: 0.2s; 
        }
        .draggable-shoe:active { 
            cursor: grabbing; 
            transform: scale(0.95); 
        }
        .draggable-shoe:hover { 
            border-color: #00ffcc; 
            box-shadow: 0 0 15px rgba(0,255,204,0.15); 
        }
        .shoe-label { 
            font-weight: bold; 
            margin-bottom: 10px; 
            display: block; 
            color: #ccc; 
            letter-spacing: 1px;
        }
        .crime-scene { 
            width: 300px; 
            height: 400px; 
            border: 2px dashed #660000; 
            background: #050505; 
            position: relative; 
            display: flex; 
            justify-content: center; 
            align-items: center;
        }
        .bloody-print { 
            width: 150px; 
            height: 300px; 
            fill: rgba(139,0,0,0.6); 
            filter: drop-shadow(0 0 5px #8b0000); 
        }
        .suspect-svg { 
            fill: rgba(0, 255, 204, 0.4); 
            stroke: #00ffcc; 
            stroke-width: 2; 
            pointer-events: none; 
        }
        
        /* Şüphelilerin Ayakkabı Kalıbı Ölçüleri */
        #shoe-ozgur .suspect-svg { width: 135px; height: 270px; } /* 40 Numara */
        #shoe-melis .suspect-svg { width: 120px; height: 240px; } /* 38 Numara */
        #shoe-davut .suspect-svg { width: 150px; height: 300px; } /* 42 Numara (Katil) */

        .dropped-shoe { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); 
        }

        #terminal-output { 
            margin-top: 30px; 
            padding: 20px; 
            background: #000; 
            border: 1px solid #222; 
            min-height: 50px; 
            font-size: 18px; 
            font-weight: bold; 
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error { color: #ff3333; text-shadow: 0 0 8px #ff0000; }
        .success { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Biyometrik İz Analizi</h1>
        <p>Aşağıdaki şüpheli ayakkabı kalıplarını farenizle tutarak merkezdeki kanlı olay yeri izinin üzerine sürükleyip bırakın.</p>
        
        <div class="game-area">
            <div class="suspect-panel">
                <div class="draggable-shoe" id="shoe-ozgur" draggable="true" ondragstart="drag(event)">
                    <span class="shoe-label">Çırak Özgür (40 Numara)</span>
                    <svg class="suspect-svg" viewBox="0 0 100 200">
                        <path d="M 30,20 C 10,20 5,60 20,80 L 35,130 C 35,190 65,190 65,130 L 80,80 C 95,60 90,20 70,20 C 60,20 50,30 50,30 C 50,30 40,20 30,20 Z" />
                    </svg>
                </div>
                
                <div class="draggable-shoe" id="shoe-melis" draggable="true" ondragstart="drag(event)">
                    <span class="shoe-label">Melis Bilikçi (38 Numara)</span>
                    <svg class="suspect-svg" viewBox="0 0 100 200">
                        <path d="M 30,20 C 10,20 5,60 20,80 L 35,130 C 35,190 65,190 65,130 L 80,80 C 95,60 90,20 70,20 C 60,20 50,30 50,30 C 50,30 40,20 30,20 Z" />
                    </svg>
                </div>

                <div class="draggable-shoe" id="shoe-davut" draggable="true" ondragstart="drag(event)">
                    <span class="shoe-label">Davut Bilikçi (42 Numara)</span>
                    <svg class="suspect-svg" viewBox="0 0 100 200">
                        <path d="M 30,20 C 10,20 5,60 20,80 L 35,130 C 35,190 65,190 65,130 L 80,80 C 95,60 90,20 70,20 C 60,20 50,30 50,30 C 50,30 40,20 30,20 Z" />
                    </svg>
                </div>
            </div>
            
            <div class="crime-scene" id="drop-zone" ondrop="drop(event)" ondragover="allowDrop(event)">
                <svg class="bloody-print" viewBox="0 0 100 200">
                    <path d="M 30,20 C 10,20 5,60 20,80 L 35,130 C 35,190 65,190 65,130 L 80,80 C 95,60 90,20 70,20 C 60,20 50,30 50,30 C 50,30 40,20 30,20 Z" />
                    <path d="M 35,50 Q 50,60 65,50" fill="none" stroke-width="3" stroke="#8b0000"/>
                    <path d="M 35,70 Q 50,80 65,70" fill="none" stroke-width="3" stroke="#8b0000"/>
                </svg>
            </div>
        </div>

        <div id="terminal-output">DELİL BEKLENİYOR... DİJİTAL KALIPLARI MERKEZE SÜRÜKLEYİN.</div>
    </div>

    <script>
        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev) {
            ev.preventDefault();
            const data = ev.dataTransfer.getData("text");
            const draggedElement = document.getElementById(data);
            const dropZone = document.getElementById("drop-zone");
            const terminal = document.getElementById("terminal-output");

            const existingCopy = dropZone.querySelector('.dropped-shoe');
            if(existingCopy) {
                existingCopy.remove();
            }

            const svgElement = draggedElement.querySelector('svg').cloneNode(true);
            svgElement.classList.add('dropped-shoe');
            dropZone.appendChild(svgElement);

            if (data === "shoe-davut") {
                terminal.innerHTML = "SİSTEM ONAYI: MİLİMETRİK EŞLEŞME SAĞLANDI! <br> ŞÜPHELİ: DAVUT BİLİKÇİ";
                terminal.className = "success";
                svgElement.style.stroke = "#00ffcc";
                svgElement.style.fill = "rgba(0,255,204,0.6)";
            } else if (data === "shoe-ozgur") {
                terminal.innerHTML = "UYUMSUZLUK TESPİT EDİLDİ: 40 NUMARA KALIP SAHADAKİ İZDEN KÜÇÜK.";
                terminal.className = "error";
                svgElement.style.stroke = "#ff3333";
                svgElement.style.fill = "rgba(255,51,51,0.4)";
            } else if (data === "shoe-melis") {
                terminal.innerHTML = "UYUMSUZLUK TESPİT EDİLDİ: 38 NUMARA KALIP SAHADAKİ İZDEN ÇOK KÜÇÜK.";
                terminal.className = "error";
                svgElement.style.stroke = "#ff3333";
                svgElement.style.fill = "rgba(255,51,51,0.4)";
            }
        }
    </script>
</body>
</html>
