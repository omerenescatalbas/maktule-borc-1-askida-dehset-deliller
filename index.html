<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kriminal Analiz Ünitesi v5.0</title>
    <style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 900px;
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.8);
        }
        .header {
            text-align: center;
            border-bottom: 1px solid #222;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        h1 {
            color: #a30000;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .main-ui {
            display: flex;
            gap: 25px;
        }
        .display-area {
            flex: 1.2;
            background: #000;
            border: 2px solid #1a1a1a;
            height: 450px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #canvas-filter {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.05s linear;
        }
        .blood-svg {
            width: 280px;
            height: 400px;
        }
        /* Gizli numara başlangıçta soluk ve arkaplana yakın */
        #number-42 {
            font-family: 'Arial Black', sans-serif;
            font-size: 100px;
            fill: #4d0000; 
            transition: fill 0.3s ease;
        }
        .sidebar {
            flex: 0.8;
            background: #151515;
            padding: 20px;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .control-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        label {
            font-size: 13px;
            color: #aaa;
            text-transform: uppercase;
        }
        input[type=range] {
            width: 100%;
            cursor: pointer;
            accent-color: #a30000;
        }
        #analyze-btn {
            margin-top: auto;
            padding: 15px;
            background: #222;
            color: #444;
            border: 1px solid #333;
            font-weight: bold;
            text-transform: uppercase;
            cursor: not-allowed;
            transition: all 0.3s;
        }
        #analyze-btn.active {
            background: #a30000;
            color: #fff;
            border-color: #ff0000;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(163, 0, 0, 0.6);
        }
        #status-bar {
            margin-top: 20px;
            background: #000;
            padding: 15px;
            text-align: center;
            font-family: monospace;
            border: 1px solid #222;
        }
        .success-text { color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>ADLİ GÖRÜNTÜ İŞLEME MERKEZİ</h1>
    </div>

    <div class="main-ui">
        <div class="display-area">
            <div id="canvas-filter">
                <svg class="blood-svg" viewBox="0 0 200 300">
                    <path d="M 40,20 C 10,40 5,100 20,140 L 45,210 C 45,280 115,290 115,210 L 140,140 C 160,100 150,40 120,20 Z" fill="#3a0000" />
                    <path d="M 50,60 L 110,60" fill="none" stroke="#2a0000" stroke-width="5" stroke-dasharray="5,3"/>
                    <path d="M 55,90 L 115,90" fill="none" stroke="#2a0000" stroke-width="5" stroke-dasharray="5,3"/>
                    <text x="100" y="180" id="number-42" text-anchor="middle">42</text>
                </svg>
            </div>
        </div>

        <div class="sidebar">
            <div class="control-block">
                <label>IŞIK (EXPOSURE)</label>
                <input type="range" id="light" min="20" max="250" value="30">
            </div>
            <div class="control-block">
                <label>ZITLIK (CONTRAST)</label>
                <input type="range" id="contrast" min="50" max="300" value="70">
            </div>
            <div class="control-block">
                <label>KESKİNLİK (SHARPEN)</label>
                <input type="range" id="blur" min="0" max="15" value="12" step="0.1">
            </div>
            <div class="control-block">
                <label>GAMMA (DENSITY)</label>
                <input type="range" id="gamma" min="0.5" max="3" value="0.8" step="0.1">
            </div>
            <button id="analyze-btn">ANALİZİ BAŞLAT</button>
        </div>
    </div>

    <div id="status-bar">SİSTEM HAZIR. LÜTFEN GÖRÜNTÜYÜ NETLEŞTİRİN.</div>
</div>

<script>
    const filterLayer = document.getElementById('canvas-filter');
    const num42 = document.getElementById('number-42');
    const btn = document.getElementById('analyze-btn');
    const status = document.getElementById('status-bar');

    const inputs = {
        light: document.getElementById('light'),
        contrast: document.getElementById('contrast'),
        blur: document.getElementById('blur'),
        gamma: document.getElementById('gamma')
    };

    // Hedef Değerler (Zorluk seviyesi ayarlandı - Oyuncu zevk alsın diye makul aralıklar bırakıldı)
    const targets = {
        light: [140, 190],
        contrast: [180, 250],
        blur: [0, 1.5],
        gamma: [1.5, 2.5]
    };

    function update() {
        const l = inputs.light.value;
        const c = inputs.contrast.value;
        const b = inputs.blur.value;
        const g = inputs.gamma.value;

        // Görseli güncelle
        filterLayer.style.filter = `brightness(${l}%) contrast(${c}%) blur(${b}px) opacity(${g/3})`;
        
        // Netlik arttıkça numaranın rengini aç (42 yavaş yavaş belirsin)
        if (b < 5) {
            num42.style.fill = "#ff0000";
        } else {
            num42.style.fill = "#4d0000";
        }

        // Kontrol
        const isOk = (l >= targets.light[0] && l <= targets.light[1]) &&
                     (c >= targets.contrast[0] && c <= targets.contrast[1]) &&
                     (b >= targets.blur[0] && b <= targets.blur[1]) &&
                     (g >= targets.gamma[0] && g <= targets.gamma[1]);

        if (isOk) {
            btn.classList.add('active');
            btn.disabled = false;
            status.innerHTML = "<span class='success-text'>DOKU ANALİZİNE HAZIR! NUMARA TESPİT EDİLDİ.</span>";
        } else {
            btn.classList.remove('active');
            btn.disabled = true;
            status.innerHTML = "GÖRÜNTÜ İŞLENİYOR... (" + (b > 2 ? "ODAK HATASI" : "DEĞERLERİ AYARLAYIN") + ")";
        }
    }

    Object.values(inputs).forEach(input => input.addEventListener('input', update));

    btn.onclick = () => {
        status.innerHTML = "<span class='success-text'>ANALİZ TAMAMLANDI: OLAY YERİNDEKİ İZ 42 NUMARA OLARAK KAYDEDİLDİ.</span>";
        btn.innerHTML = "ONAYLANDI";
        btn.classList.remove('active');
        Object.values(inputs).forEach(i => i.disabled = true);
    };
</script>

</body>
</html>
