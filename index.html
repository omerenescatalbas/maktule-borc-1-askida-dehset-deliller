<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Bilişim Şube - İmaj Netleştirme v3.1</title>
    <style>
        body {
            background-color: #020202;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            user-select: none;
        }
        .container {
            width: 950px;
            background: #0a0a0a;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.2);
            padding: 30px;
            display: flex;
            flex-direction: column;
        }
        .header {
            border-bottom: 2px dashed #444;
            padding-bottom: 15px;
            margin-bottom: 25px;
            text-align: center;
        }
        h1 {
            color: #8b0000;
            letter-spacing: 4px;
            margin: 0 0 10px 0;
            font-size: 26px;
            text-transform: uppercase;
        }
        p {
            color: #777;
            font-size: 13px;
            margin: 0;
            letter-spacing: 1px;
        }
        .main-panel {
            display: flex;
            gap: 30px;
            height: 450px;
        }
        .image-viewer {
            flex: 1;
            background: repeating-linear-gradient(0deg, #111, #111 2px, #080808 2px, #080808 10px);
            border: 2px solid #222;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9);
        }
        /* Dinamik Filtre Katmanı */
        #evidence-layer {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: filter 0.1s;
        }
        .blood-stain {
            width: 250px;
            height: 400px;
        }
        .controls {
            width: 380px;
            background: #0d0d0d;
            border: 1px solid #222;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .control-group label {
            font-size: 12px;
            color: #888;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }
        .val-display {
            color: #00ffcc;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: #222;
            height: 6px;
            border-radius: 3px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 20px;
            background: #550000;
            border: 1px solid #ff4444;
            cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb:active {
            background: #ff4444;
        }
        button {
            margin-top: auto;
            background: #1a0000;
            color: #ff3333;
            border: 1px solid #ff3333;
            padding: 15px;
            font-family: inherit;
            font-weight: bold;
            font-size: 16px;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #ff3333;
            color: #000;
            box-shadow: 0 0 15px #ff3333;
        }
        button:disabled {
            background: #222;
            color: #555;
            border-color: #444;
            cursor: not-allowed;
            box-shadow: none;
        }
        #terminal {
            margin-top: 25px;
            background: #000;
            border: 1px solid #333;
            padding: 20px;
            font-size: 16px;
            min-height: 20px;
            text-align: center;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .error { color: #ff3333; text-shadow: 0 0 10px #ff0000; }
        .success { color: #00ffcc; text-shadow: 0 0 10px #00ffcc; }
        
        /* Şifreli SVG Çizimi */
        #hidden-number {
            font-family: 'Impact', sans-serif;
            font-size: 85px;
            fill: #3a0000; /* Arka plan kan rengine çok yakın, gizlenmiş */
            opacity: 0.8;
        }
        
        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: #00ffcc;
            box-shadow: 0 0 15px #00ffcc;
            top: 0;
            left: 0;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Kriminal İmaj Restorasyonu</h1>
            <p>DİKKAT: Olay yerinden elde edilen kanlı izin mikro-doku haritası aşırı derecede bozuktur. Görseli netleştirmek için laboratuvar filtrelerini senkronize ediniz.</p>
        </div>

        <div class="main-panel">
            <div class="image-viewer">
                <div class="scan-line" id="scanner"></div>
                
                <div id="evidence-layer">
                    <svg class="blood-stain" viewBox="0 0 200 300">
                        <path d="M 50,20 C 10,40 5,100 30,130 L 55,200 C 55,280 105,280 105,200 L 130,130 C 150,100 140,40 110,20 C 95,10 75,20 75,20 C 75,20 60,10 50,20 Z" fill="#4a0505" />
                        <path d="M 60,70 Q 80,90 100,70" fill="none" stroke="#330000" stroke-width="6"/>
                        <path d="M 65,110 Q 85,130 105,110" fill="none" stroke="#330000" stroke-width="6"/>
                        
                        <text x="80" y="240" id="hidden-number" text-anchor="middle" transform="rotate(-12, 80, 240)">42</text>
                    </svg>
                </div>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>X-Ray Işık Patlaması <span class="val-display" id="val-light">0x4F</span></label>
                    <input type="range" id="slide-light" min="20" max="250" value="40">
                </div>

                <div class="control-group">
                    <label>Hemoglobin Kontrastı <span class="val-display" id="val-contrast">0x2A</span></label>
                    <input type="range" id="slide-contrast" min="30" max="300" value="60">
                </div>

                <div class="control-group">
                    <label>Oksidasyon Sapması (Hue) <span class="val-display" id="val-hue">0x8B</span></label>
                    <input type="range" id="slide-hue" min="-180" max="180" value="120">
                </div>

                <div class="control-group">
                    <label>Odak / Keskinlik <span class="val-display" id="val-blur">0x0F</span></label>
                    <input type="range" id="slide-blur" min="0" max="20" value="15">
                </div>

                <button id="btn-analyze" onclick="startScan()">ÇÖZÜNÜRLÜK ANALİZİNİ BAŞLAT</button>
            </div>
        </div>

        <div id="terminal" style="color: #666;">FİLTRE DEĞERLERİ BEKLENİYOR...</div>
    </div>

    <script>
        const layer = document.getElementById('evidence-layer');
        const sLight = document.getElementById('slide-light');
        const sContrast = document.getElementById('slide-contrast');
        const sHue = document.getElementById('slide-hue');
        const sBlur = document.getElementById('slide-blur');
        
        const vLight = document.getElementById('val-light');
        const vContrast = document.getElementById('val-contrast');
        const vHue = document.getElementById('val-hue');
        const vBlur = document.getElementById('val-blur');
        
        const terminal = document.getElementById('terminal');
        const scanner = document.getElementById('scanner');
        const btn = document.getElementById('btn-analyze');
        const hiddenNumber = document.getElementById('hidden-number');

        // DOĞRU ŞİFRE KOMBİNASYONU (Çok Dar Aralık)
        const targetLight = 160;
        const targetContrast = 220;
        const targetHue = 0;
        const targetBlur = 0;
        const tolerance = 15; // Hata payı

        function toHex(val) {
            return "0x" + Math.abs(parseInt(val)).toString(16).toUpperCase().padStart(2, '0');
        }

        function updateFilters() {
            let b = sLight.value;
            let c = sContrast.value;
            let h = sHue.value;
            let bl = sBlur.value; // Ters mantık: 0 en keskin, 20 en bulanık

            vLight.innerText = toHex(b);
            vContrast.innerText = toHex(c);
            vHue.innerText = toHex(h);
            vBlur.innerText = "0x" + (20 - bl).toString(16).toUpperCase().padStart(2, '0');

            layer.style.filter = `brightness(${b}%) contrast(${c}%) hue-rotate(${h}deg) blur(${bl}px)`;
        }

        // Sürgüler hareket ettikçe filtreler anlık güncellenir
        sLight.addEventListener('input', updateFilters);
        sContrast.addEventListener('input', updateFilters);
        sHue.addEventListener('input', updateFilters);
        sBlur.addEventListener('input', updateFilters);

        function startScan() {
            btn.disabled = true;
            terminal.innerHTML = "KRİPTOLOJİK TARAMA YAPILIYOR...";
            terminal.style.color = "#ffaa00";
            
            scanner.style.display = "block";
            let pos = 0;
            
            let scanAnim = setInterval(() => {
                pos += 12;
                scanner.style.top = pos + "px";
                
                if(pos > 450) {
                    clearInterval(scanAnim);
                    scanner.style.display = "none";
                    scanner.style.top = "0px";
                    evaluateImage();
                }
            }, 30);
        }

        function evaluateImage() {
            let b = parseInt(sLight.value);
            let c = parseInt(sContrast.value);
            let h = parseInt(sHue.value);
            let bl = parseInt(sBlur.value);

            let isLightOk = Math.abs(b - targetLight) <= tolerance;
            let isContrastOk = Math.abs(c - targetContrast) <= tolerance;
            let isHueOk = Math.abs(h - targetHue) <= tolerance;
            let isBlurOk = bl <= 2; // Odak neredeyse sıfır olmalı

            if (isLightOk && isContrastOk && isHueOk && isBlurOk) {
                // Şifre Çözüldü
                layer.style.filter = `brightness(150%) contrast(200%) hue-rotate(0deg) blur(0px)`;
                hiddenNumber.style.fill = "#00ffcc"; // Gizli numara neon yeşile döner
                
                terminal.innerHTML = "DOKU ÇÖZÜNÜRLÜĞÜ %100.<br> GİZLİ VERİ TESPİT EDİLDİ: 42 NUMARA AYAK İZİ.";
                terminal.className = "success";
                
                // Oyuncu kazanınca sürgüler kilitlenir
                sLight.disabled = true;
                sContrast.disabled = true;
                sHue.disabled = true;
                sBlur.disabled = true;
            } else {
                // Şifre Yanlış
                terminal.innerHTML = "SİNYAL KİRLİ. PARAMETRELER EŞLEŞMİYOR. DAHA HASSAS AYAR YAPINIZ.";
                terminal.className = "error";
                btn.disabled = false;
            }
        }

        // Başlangıç durumu
        updateFilters();
    </script>
</body>
</html>
