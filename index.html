<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kriminal Kalibrasyon Cihazı - v2.4</title>
    <style>
        body { 
            background: #030303; 
            color: #d4d4d4; 
            font-family: 'Courier New', monospace; 
            margin: 0; 
            padding: 20px; 
            user-select: none;
        }
        .container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: #0a0a0a; 
            border: 1px solid #333; 
            box-shadow: 0 0 40px rgba(139,0,0,0.15); 
            display: flex;
            flex-direction: column;
        }
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid #222;
        }
        h1 { 
            color: #8b0000; 
            letter-spacing: 3px; 
            margin: 0;
            font-size: 24px;
        }
        .main-panel {
            display: flex;
            height: 500px;
        }
        .viewport {
            flex: 1;
            position: relative;
            background: repeating-linear-gradient(45deg, #050505, #050505 10px, #0a0a0a 10px, #0a0a0a 20px);
            border-right: 2px solid #222;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .controls {
            width: 350px;
            padding: 20px;
            background: #111;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .bloody-print {
            position: absolute;
            width: 160px;
            height: 320px;
            fill: rgba(139,0,0,0.7);
            filter: drop-shadow(0 0 5px #8b0000);
        }
        .digital-print {
            position: absolute;
            width: 160px;
            height: 320px;
            fill: rgba(0, 255, 204, 0.2);
            stroke: #00ffcc;
            stroke-width: 2;
            transform-origin: center center;
            transition: transform 0.1s;
        }
        .control-group label {
            display: block;
            color: #888;
            font-size: 14px;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        input[type=range] {
            width: 100%;
            accent-color: #00ffcc;
            background: #222;
            height: 5px;
            border-radius: 5px;
            appearance: none;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none;
            width: 15px;
            height: 15px;
            background: #00ffcc;
            cursor: pointer;
            border-radius: 50%;
        }
        .value-display {
            float: right;
            color: #00ffcc;
            font-weight: bold;
        }
        select {
            width: 100%;
            padding: 10px;
            background: #050505;
            color: #00ffcc;
            border: 1px solid #444;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        button {
            background: #2a0000;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 15px;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: auto;
            letter-spacing: 2px;
        }
        button:hover {
            background: #ff4444;
            color: #000;
            box-shadow: 0 0 15px #ff4444;
        }
        #status-screen {
            background: #000;
            border-top: 2px solid #222;
            padding: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            min-height: 25px;
            letter-spacing: 1px;
        }
        .scan-laser {
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 3px;
            background: #ff0000;
            box-shadow: 0 0 20px 5px #ff0000;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>MİKRO-TOPOGRAFİK TABAN EŞLEŞTİRME</h1>
            <p style="color: #666; margin-top: 5px; font-size: 12px;">Delil kalıplarını X, Y ve Açı eksenlerinde kaydırarak kanlı iz ile milimetrik hizalayınız.</p>
        </div>

        <div class="main-panel">
            <div class="viewport">
                <div class="scan-laser" id="laser"></div>
                
                <!-- Sahadaki Kanlı İz -->
                <svg class="bloody-print" viewBox="0 0 100 200">
                    <path d="M 30,20 C 10,20 5,60 20,80 L 35,130 C 35,190 65,190 65,130 L 80,80 C 95,60 90,20 70,20 C 60,20 50,30 50,30 C 50,30 40,20 30,20 Z" />
                    <path d="M 35,50 Q 50,60 65,50" fill="none" stroke-width="3" stroke="#500000"/>
                    <path d="M 35,70 Q 50,80 65,70" fill="none" stroke-width="3" stroke="#500000"/>
                </svg>

                <!-- Kontrol Edilen Şeffaf Dijital İz -->
                <svg class="digital-print" id="digital-layer" viewBox="0 0 100 200">
                    <path d="M 30,20 C 10,20 5,60 20,80 L 35,130 C 35,190 65,190 65,130 L 80,80 C 95,60 90,20 70,20 C 60,20 50,30 50,30 C 50,30 40,20 30,20 Z" />
                    <path d="M 35,50 Q 50,60 65,50" fill="none" stroke-width="3"/>
                    <path d="M 35,70 Q 50,80 65,70" fill="none" stroke-width="3"/>
                </svg>
            </div>

            <div class="controls">
                <div class="control-group">
                    <label>İncelenecek Delil:</label>
                    <select id="evidence-select" onchange="changeEvidence()">
                        <option value="42">Makine Arkası (42 Numara Spor)</option>
                        <option value="40">Özgür'ün Odası (40 Numara Spor)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label>Yatay Kaydırma (X) <span class="value-display" id="val-x">0</span></label>
                    <input type="range" id="slider-x" min="-50" max="50" value="-35" oninput="updateTransform()">
                </div>

                <div class="control-group">
                    <label>Dikey Kaydırma (Y) <span class="value-display" id="val-y">0</span></label>
                    <input type="range" id="slider-y" min="-50" max="50" value="40" oninput="updateTransform()">
                </div>

                <div class="control-group">
                    <label>Rotasyon / Açı <span class="value-display" id="val-a">0°</span></label>
                    <input type="range" id="slider-a" min="-45" max="45" value="25" oninput="updateTransform()">
                </div>

                <button onclick="startAnalysis()">LAZER TARAMAYI BAŞLAT</button>
            </div>
        </div>

        <div id="status-screen" style="color: #666;">KALİBRASYON BEKLENİYOR...</div>
    </div>

    <script>
        const layer = document.getElementById('digital-layer');
        const slideX = document.getElementById('slider-x');
        const slideY = document.getElementById('slider-y');
        const slideA = document.getElementById('slider-a');
        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');
        const valA = document.getElementById('val-a');
        const evSelect = document.getElementById('evidence-select');
        const statusSrc = document.getElementById('status-screen');
        const laser = document.getElementById('laser');

        // Hedef doğruluğu (Bu koordinatları bulması lazım)
        const targetX = 0;
        const targetY = 0;
        const targetA = 0;
        const tolerance = 3; 

        function changeEvidence() {
            updateTransform();
            statusSrc.innerHTML = "KALİBRASYON BEKLENİYOR...";
            statusSrc.style.color = "#666";
        }

        function updateTransform() {
            let x = parseInt(slideX.value);
            let y = parseInt(slideY.value);
            let a = parseInt(slideA.value);
            let scale = evSelect.value === "40" ? 0.88 : 1.0;

            valX.innerText = x;
            valY.innerText = y;
            valA.innerText = a + "°";

            layer.style.transform = `translate(${x}px, ${y}px) rotate(${a}deg) scale(${scale})`;
            layer.style.stroke = "#00ffcc";
        }

        function startAnalysis() {
            statusSrc.innerHTML = "MİKRO-HÜCRESEL TARAMA YAPILIYOR...";
            statusSrc.style.color = "#ffaa00";
            
            // Lazer animasyonu
            laser.style.display = "block";
            let pos = -10;
            let scan = setInterval(() => {
                pos += 15;
                laser.style.top = pos + "px";
                if(pos > 500) {
                    clearInterval(scan);
                    laser.style.display = "none";
                    laser.style.top = "-10px";
                    evaluateResult();
                }
            }, 30);
        }

        function evaluateResult() {
            let x = parseInt(slideX.value);
            let y = parseInt(slideY.value);
            let a = parseInt(slideA.value);
            let evidence = evSelect.value;

            if(evidence === "40") {
                statusSrc.innerHTML = "HATA: 40 NUMARA KALIP BOYUTU EŞLEŞMİYOR. AŞINMA İZLERİ UYUMSUZ.";
                statusSrc.style.color = "#ff3333";
                layer.style.stroke = "#ff3333";
                return;
            }

            // 42 numara için koordinat kontrolü
            if(Math.abs(x - targetX) <= tolerance && 
               Math.abs(y - targetY) <= tolerance && 
               Math.abs(a - targetA) <= tolerance) {
                statusSrc.innerHTML = "EŞLEŞME ONAYLANDI: 42 NUMARA SPOR AYAKKABI OLAY YERİNDEKİ İZ İLE BİREBİR UYUMLU.";
                statusSrc.style.color = "#00ffcc";
                layer.style.stroke = "#00ffcc";
            } else {
                statusSrc.innerHTML = "HATA: KOORDİNATLAR HİZALANAMADI. DAHA HASSAS KALİBRE EDİNİZ.";
                statusSrc.style.color = "#ff3333";
                layer.style.stroke = "#ff3333";
            }
        }

        // Başlangıç durumu
        updateTransform();
    </script>
</body>
</html>
