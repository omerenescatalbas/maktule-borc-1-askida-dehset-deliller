<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Adli Bilişim - Kanıt Analizi</title>
    <style>
        body { background: #050505; color: #eee; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 900px; background: #111; border: 2px solid #333; padding: 30px; box-shadow: 0 0 50px #000; }
        .header { text-align: center; border-bottom: 2px solid #800; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: #f00; margin: 0; letter-spacing: 5px; text-transform: uppercase; }
        .desc { color: #888; font-size: 14px; margin-top: 10px; line-height: 1.4; }
        .main-ui { display: flex; gap: 30px; }
        .display-area { flex: 1.5; background: #000; height: 500px; border: 1px solid #444; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #canvas-filter { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; transition: filter 0.05s; }
        .shoe-trace { width: 220px; height: 420px; fill: #400; filter: drop-shadow(0 0 10px #600); }
        #gizli-42 { font-family: 'Impact', sans-serif; font-size: 100px; fill: #f00; opacity: 0; transition: opacity 0.5s; }
        .controls { flex: 0.8; background: #1a1a1a; padding: 20px; border: 1px solid #333; display: flex; flex-direction: column; gap: 25px; }
        label { font-size: 12px; color: #aaa; font-weight: bold; letter-spacing: 1px; }
        input[type=range] { width: 100%; accent-color: #f00; cursor: pointer; }
        #analyze-btn { padding: 20px; background: #300; color: #f66; border: 1px solid #f00; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; }
        #analyze-btn:hover { background: #f00; color: #000; box-shadow: 0 0 20px #f00; }
        #status-bar { margin-top: 25px; background: #000; padding: 20px; border: 1px solid #222; text-align: center; font-weight: bold; }
        .success { color: #0f0; text-shadow: 0 0 10px #0f0; }
        .fail { color: #f33; text-shadow: 0 0 10px #f00; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>ADLİ İMAJ RESTORASYONU</h1>
        <p class="desc">DİKKAT: Kan gölündeki iz aşırı deforme olmuştur. Aşağıdaki parametreleri kullanarak görseli netleştirin. 42 rakamı okunur hale geldiğinde analizi onaylayın.</p>
    </div>
    <div class="main-ui">
        <div class="display-area">
            <div id="canvas-filter">
                <svg class="shoe-trace" viewBox="0 0 100 200">
                    <path d="M 30,20 Q 15,20 15,50 Q 15,80 25,100 L 35,135 Q 35,150 40,180 Q 50,190 60,180 Q 65,150 65,135 L 75,100 Q 85,80 85,50 Q 85,20 70,20 Z" />
                    <g fill="none" stroke="#200" stroke-width="3">
                        <path d="M 20,40 H 80 M 18,60 H 82 M 20,80 H 80 M 35,110 H 65 M 38,150 H 62" />
                    </g>
                    <text x="50" y="95" id="gizli-42" text-anchor="middle">42</text>
                </svg>
            </div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>IŞIK GÜCÜ (LUMINANCE)</label>
                <input type="range" id="l" min="20" max="250" value="40">
            </div>
            <div class="control-group">
                <label>PİKSEL ZITLIĞI (CONTRAST)</label>
                <input type="range" id="c" min="50" max="300" value="60">
            </div>
            <div class="control-group">
                <label>ODAK NETLİĞİ (SHARPEN)</label>
                <input type="range" id="b" min="0" max="15" value="12" step="0.1">
            </div>
            <div class="control-group">
                <label>DOKU DOYGUNLUĞU (SATURATION)</label>
                <input type="range" id="s" min="0" max="5" value="0.5" step="0.1">
            </div>
            <button id="analyze-btn" onclick="checkFinal()">ANALİZİ ONAYLA</button>
        </div>
    </div>
    <div id="status-bar">SİSTEM ANALİZ İÇİN KOMUT BEKLİYOR...</div>
</div>

<script>
    const filterLayer = document.getElementById('canvas-filter');
    const numara = document.getElementById('gizli-42');
    const status = document.getElementById('status-bar');
    const sliders = document.querySelectorAll('input');

    function update() {
        const l = document.getElementById('l').value;
        const c = document.getElementById('c').value;
        const b = document.getElementById('b').value;
        const s = document.getElementById('s').value;

        filterLayer.style.filter = `brightness(${l}%) contrast(${c}%) blur(${b}px) saturate(${s})`;

        // 42 rakamı sadece netleşince belirsin
        let opacity = 0;
        if(b < 4) opacity = (4 - b) / 4;
        if(l < 100) opacity = 0; // Işık yetersizse görünmez
        numara.style.opacity = opacity;
    }

    sliders.forEach(s => s.addEventListener('input', update));

    function checkFinal() {
        const l = document.getElementById('l').value;
        const c = document.getElementById('c').value;
        const b = document.getElementById('b').value;
        const s = document.getElementById('s').value;

        // Kazanma sınırları
        const win = (l > 130 && l < 200) && (c > 160 && c < 260) && (b < 2) && (s > 1.5);

        if(win) {
            status.innerHTML = "<span class='success'>ANALİZ BAŞARILI: İZİN 42 NUMARA OLDUĞU KESİNLEŞTİ!</span>";
            numara.style.opacity = 1;
            numara.style.fill = "#0f0";
            numara.style.textShadow = "0 0 20px #0f0";
            document.getElementById('analyze-btn').disabled = true;
            sliders.forEach(sl => sl.disabled = true);
        } else {
            status.innerHTML = "<span class='fail'>ANALİZ HATASI: GÖRÜNTÜ YETERİNCE NET DEĞİL!</span>";
            setTimeout(() => { if(!win) status.innerHTML = "SİSTEM ANALİZ İÇİN KOMUT BEKLİYOR..."; }, 2000);
        }
    }
    update();
</script>
</body>
</html>
