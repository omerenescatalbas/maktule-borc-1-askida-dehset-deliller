<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kriminal İmaj Analizi</title>
    <style>
        body { background: #050505; color: #eee; font-family: 'Courier New', monospace; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 950px; background: #0d0d0d; border: 1px solid #333; padding: 30px; box-shadow: 0 0 50px #000; border-radius: 4px; }
        .header { text-align: center; border-bottom: 2px solid #600; padding-bottom: 20px; margin-bottom: 30px; }
        h1 { color: #f00; margin: 0; letter-spacing: 6px; text-transform: uppercase; font-weight: 900; }
        .desc { color: #888; font-size: 14px; margin-top: 10px; line-height: 1.5; border-left: 3px solid #600; padding-left: 15px; }
        .main-ui { display: flex; gap: 40px; }
        .display-area { flex: 1.5; background: #000; height: 500px; border: 2px solid #222; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 0 100px #000; }
        #canvas-filter { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; transition: filter 0.05s linear; }
        
        /* GERÇEKÇİ BOT TABANI ÇİZİMİ */
        .shoe-trace { width: 200px; height: 400px; fill: #300; }
        #gizli-42 { font-family: 'Arial Black', sans-serif; font-size: 100px; fill: #f00; opacity: 0; transition: opacity 0.5s; }
        
        .controls { flex: 0.8; background: #151515; padding: 25px; border: 1px solid #333; display: flex; flex-direction: column; gap: 20px; }
        label { font-size: 11px; color: #ff4444; font-weight: bold; letter-spacing: 2px; }
        input[type=range] { width: 100%; accent-color: #f00; cursor: pointer; height: 8px; }
        
        #analyze-btn { padding: 20px; background: #200; color: #f99; border: 1px solid #f00; font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; transition: 0.3s; margin-top: 10px; }
        #analyze-btn:hover { background: #f00; color: #000; box-shadow: 0 0 25px #f00; }
        
        #status-bar { margin-top: 30px; background: #000; padding: 20px; border: 1px solid #222; text-align: center; font-weight: bold; font-family: monospace; font-size: 16px; min-height: 20px; }
        .success { color: #0f0; text-shadow: 0 0 15px #0f0; }
        .fail { color: #f33; text-shadow: 0 0 15px #f00; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>ADLİ İMAJ RESTORASYONU</h1>
        <p class="desc">DİKKAT: Kan gölündeki delil yüksek oranda pıhtılaşmış ve korozyona uğramıştır. Dijital filtreleri kullanarak doku netliğini sağlayın. 42 rakamı okunur hale geldiğinde analizi resmileştirin.</p>
    </div>
    <div class="main-ui">
        <div class="display-area">
            <div id="canvas-filter">
                <svg class="shoe-trace" viewBox="0 0 100 200">
                    <path d="M 50,10 C 25,10 20,40 20,60 C 20,90 40,105 40,130 C 40,150 35,160 35,185 C 45,195 55,195 65,185 C 65,160 60,150 60,130 C 60,105 80,90 80,60 C 80,40 75,10 50,10 Z" />
                    <g fill="none" stroke="#100" stroke-width="4">
                        <path d="M 25,40 H 75 M 22,60 H 78 M 25,85 H 75 M 42,145 H 58 M 40,170 H 60" />
                    </g>
                    <text x="50" y="100" id="gizli-42" text-anchor="middle">42</text>
                </svg>
            </div>
        </div>
        <div class="controls">
            <div class="control-group">
                <label>IŞIK GÜCÜ (LUMINANCE)</label>
                <input type="range" id="l" min="20" max="250" value="40">
            </div>
            <div class="control-group">
                <label>PİKSEL ZITLIĞI (CONTRAST)</label>
                <input type="range" id="c" min="50" max="300" value="60">
            </div>
            <div class="control-group">
                <label>ODAK NETLİĞİ (FOCUS)</label>
                <input type="range" id="b" min="0" max="20" value="16" step="0.5">
            </div>
            <div class="control-group">
                <label>DOYGUNLUK (SATURATION)</label>
                <input type="range" id="s" min="0" max="5" value="0.5" step="0.1">
            </div>
            <button id="analyze-btn" onclick="checkFinal()">ANALİZİ ONAYLA</button>
        </div>
    </div>
    <div id="status-bar">SİNYAL BEKLENİYOR...</div>
</div>

<script>
    const filterLayer = document.getElementById('canvas-filter');
    const numara = document.getElementById('gizli-42');
    const status = document.getElementById('status-bar');
    const sliders = document.querySelectorAll('input');

    function update() {
        const l = document.getElementById('l').value;
        const c = document.getElementById('c').value;
        const b = document.getElementById('b').value;
        const s = document.getElementById('s').value;

        filterLayer.style.filter = `brightness(${l}%) contrast(${c}%) blur(${b}px) saturate(${s})`;

        // OYUNCU 42'Yİ GÖRMEYE BAŞLASIN
        let opacity = 0;
        if(b < 7) opacity = (7 - b) / 7;
        if(l < 80) opacity = 0;
        numara.style.opacity = opacity;
    }

    sliders.forEach(s => s.addEventListener('input', update));

    function checkFinal() {
        const l = document.getElementById('l').value;
        const c = document.getElementById('c').value;
        const b = document.getElementById('b').value;
        const s = document.getElementById('s').value;

        // KAZANMA KOŞULLARINI GENİŞLETTİM: OYUNCU GÖRÜYORSA KAZANIR
        const isLightOk = (l > 110);
        const isContrastOk = (c > 130);
        const isBlurOk = (b < 4);
        const isSatOk = (s > 1.2);

        if(isLightOk && isContrastOk && isBlurOk && isSatOk) {
            status.innerHTML = "<span class='success'>ANALİZ TAMAMLANDI: AYAKKABI ÖLÇÜSÜ 42 OLARAK TESPİT EDİLDİ!</span>";
            numara.style.opacity = 1;
            numara.style.fill = "#0f0";
            numara.style.textShadow = "0 0 20px #0f0";
            document.getElementById('analyze-btn').innerHTML = "ONAYLANDI";
            document.getElementById('analyze-btn').disabled = true;
            sliders.forEach(sl => sl.disabled = true);
        } else {
            status.innerHTML = "<span class='fail'>HATA: VERİ OKUNAMIYOR. GÖRSELİ NETLEŞTİRİN!</span>";
        }
    }
    update();
</script>
</body>
</html>
